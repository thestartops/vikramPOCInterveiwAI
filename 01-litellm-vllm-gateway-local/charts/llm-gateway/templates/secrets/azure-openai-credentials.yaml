# Credentials LiteLLM uses for the Azure OpenAI fallback route (Step 4).
apiVersion: v1
kind: Secret
metadata:
  name: azure-openai-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.azure.apiKey | quote }}
  api-base: {{ .Values.secrets.azure.apiBase | quote }}
  api-version: {{ .Values.secrets.azure.apiVersion | quote }}
