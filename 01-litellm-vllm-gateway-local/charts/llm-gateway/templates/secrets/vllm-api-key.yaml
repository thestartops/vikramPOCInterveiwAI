# Bearer token vLLM's OpenAI-compatible server checks (if you run it with
# --api-key set - we'll wire that in Step 3). LiteLLM sends this back to vLLM.
apiVersion: v1
kind: Secret
metadata:
  name: vllm-api-key
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.vllmApiKey | quote }}
