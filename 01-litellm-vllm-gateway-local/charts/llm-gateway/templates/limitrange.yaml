apiVersion: v1
kind: LimitRange
metadata:
  name: llm-gateway-limits
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu }}
        memory: {{ .Values.limitRange.defaultRequestMemory }}
      default:
        cpu: {{ .Values.limitRange.defaultLimitCpu }}
        memory: {{ .Values.limitRange.defaultLimitMemory }}
