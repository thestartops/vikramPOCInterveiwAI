# ClusterIP - only reachable from inside the cluster (LiteLLM will call this
# at vllm.llm-gateway.svc.cluster.local:8000 once we build Step 5).
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm
spec:
  selector:
    app.kubernetes.io/component: vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.vllm.port }}
      targetPort: http
